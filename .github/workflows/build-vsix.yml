name: Build VSIX

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: |
          mkdir -p dist
          npx --yes @vscode/vsce package --out dist/windsurf-auto-mcp.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windsurf-auto-mcp-vsix
          path: dist/*.vsix
