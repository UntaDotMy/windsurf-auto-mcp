name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature]
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  osv-scan:
    name: OSV Scan
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.1"
    with:
      scan-args: |-
        --recursive
        ./
